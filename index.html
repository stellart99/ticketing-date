function countdown(ms){if(ms<=0)return"오픈!";var s=Math.floor(ms/1000),dd=Math.floor(s/86400);s%=86400;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return(dd?dd+"일 ":"")+p2(h)+":"+p2(m)+":"+p2(sec)}
function gcal(sh,o){var d=parseDT(o.at),e=new Date(d.getTime()+30*6e4);function f(x){return x.getFullYear()+p2(x.getMonth()+1)+p2(x.getDate())+"T"+p2(x.getHours())+p2(x.getMinutes())+"00"}
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("🎫 "+sh.title+" "+(o.label||"티켓")+" 오픈")+"&dates="+f(d)+"/"+f(e)+"&ctz=Asia/Seoul&details="+encodeURIComponent([sh.site,sh.url,sh.venue,sh.memo].filter(Boolean).join("\n"))}
function safeUrl(u){u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function passes(sh){return(ui.genre==="all"||sh.genre===ui.genre)&&(ui.status==="all"||sh.status===ui.status||(ui.status==="active"&&sh.status!=="done"&&sh.status!=="skip"))}
function find(id){for(var i=0;i<state.shows.length;i++)if(state.shows[i].id===id)return state.shows[i];return null}
function isDim(sh){return sh.status==="done"||sh.status==="skip"}

function allOpens(){var out=[];state.shows.forEach(function(sh){if(!passes(sh))return;(sh.opens||[]).forEach(function(o){var d=parseDT(o.at);if(d)out.push({sh:sh,o:o,d:d})})});out.sort(function(a,b){return a.d-b.d});return out}

/* ---------- persistence ---------- */
function buildDoc(s){var css=document.getElementById("css").textContent,app=document.getElementById("app").textContent;
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  return'<!DOCTYPE html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘서트 티켓팅 캘린더</title>\n'+FONT_LINK+'\n<style id="css">'+css+'</style></head><body><div id="root"></div>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script></body></html>'}
function persist(msg){saveUI();if(mode==="site"){try{var ov={};state.shows.forEach(function(s){if(s.status&&s.status!=="interest")ov[s.id]=s.status});localStorage.setItem(LSK_ST,JSON.stringify(ov));toast("내 상태를 이 브라우저에 저장했어요")}catch(e){toast("저장할 수 없는 환경이에요")}return Promise.resolve()}return artP.then(function(a){
  if(a){return Promise.resolve(a.publish(buildDoc(state))).then(function(){toast(msg||"저장했어요")}).catch(function(e){var c=String((e&&(e.code||e.name))||"")+" "+String(e&&e.message||"");
    if(/conflict/i.test(c))toast("다른 곳에서 먼저 수정돼 최신 버전으로 바뀝니다");
    else if(/not_granted|not_writer/i.test(c))toast("읽기 전용이라 저장할 수 없어요");
    else toast("저장 실패: "+(e&&e.message||e))})}
  try{localStorage.setItem(LSK_DATA,JSON.stringify(state));toast(msg||"이 브라우저에 저장했어요")}catch(e){toast("저장할 수 없는 환경이에요")}
})}
var tT;function toast(t){var el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}el.textContent=t;el.classList.remove("hidden");clearTimeout(tT);tT=setTimeout(function(){el.classList.add("hidden")},2600)}

/* ---------- render ---------- */
var root=document.getElementById("root");
function render(){
  var up=state.updatedAt?parseDT(state.updatedAt):null,upTxt=up?(up.getMonth()+1)+"/"+up.getDate()+" "+hm(up):"";var info=mode==="site"?(upTxt?"마지막 확인 "+upTxt:""):mode==="local"?(upTxt?upTxt+" 기준 저장본 · 이 파일은 자동 업데이트되지 않아요":"자동 업데이트되지 않는 저장본이에요"):(upTxt?"마지막 확인 "+upTxt:"");
  var h='<div class="wrap"><header><h1><span class="stub"></span>콘서트 티켓팅 캘린더</h1><span class="saveinfo">'+info+'</span><span class="spacer"></span>'+
  '<div class="seg"><button data-act="view" data-v="cal" class="'+(ui.view==="cal"?"on":"")+'">캘린더</button><button data-act="view" data-v="list" class="'+(ui.view==="list"?"on":"")+'">목록</button></div>'+
  LINKS+(mode==="site"?"":'<button class="btn ghost" data-act="backup">백업</button>')+'</header>'+

function toolbar(){var g='<select class="f" data-act="genre"><option value="all">전체 공연장</option>'+GENRES.map(function(x){return'<option value="'+x[0]+'"'+(ui.genre===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>';
  var s='<select class="f" data-act="status"><option value="all">전체 상태</option><option value="active"'+(ui.status==="active"?" selected":"")+'>진행 중(완료·패스 제외)</option>'+STATUS.map(function(x){return'<option value="'+x[0]+'"'+(ui.status===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>';
  var nav=ui.view==="cal"?'<button class="btn sm" data-act="prev" aria-label="이전 달">‹</button><h2>'+ui.y+'년 '+(ui.m+1)+'월</h2><button class="btn sm" data-act="next" aria-label="다음 달">›</button><button class="btn sm ghost" data-act="today">오늘</button>':'<h2 style="text-align:left;margin-left:0">전체 콘서트 '+state.shows.filter(passes).length+'개</h2>';
  return'<div class="toolbar">'+nav+'<span class="spacer"></span>'+g+s+(ui.view==="cal"?'<label class="chk"><input type="checkbox" data-act="runs"'+(ui.runs?" checked":"")+'> 공연일 표시</label>':"")+'</div>'}
function legend(){return'<div class="legend">'+GENRES.map(function(g){return'<span><i style="background:'+gvar(g[0])+'"></i>'+g[1]+'</span>'}).join("")+'<span style="margin-left:auto">진한 칸 = 티켓 오픈 · 옅은 줄 = 공연일</span></div>'}

function calendar(){
  var first=new Date(ui.y,ui.m,1),start=new Date(ui.y,ui.m,1-first.getDay());
  var last=new Date(ui.y,ui.m+1,0),cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
  var byDay={};function add(k,v){(byDay[k]=byDay[k]||[]).push(v)}
  var end=new Date(start);end.setDate(end.getDate()+cells);
  state.shows.forEach(function(sh){if(!passes(sh))return;
    (sh.opens||[]).forEach(function(o){var d=parseDT(o.at);if(d)add(ymd(d),{k:"open",sh:sh,o:o,d:d})});
    if(ui.runs){var s=parseDT(sh.start),e=parseDT(sh.end)||s;if(s){if(e<s)e=s;var c=new Date(Math.max(s,start));while(c<=e&&c<end){add(ymd(c),{k:"run",sh:sh});c.setDate(c.getDate()+1)}}}
  });
  var t=ymd(new Date()),h='<div class="grid">'+DOW.map(function(d,i){return'<div class="dow'+(i===0?" sun":i===6?" sat":"")+'">'+d+'</div>'}).join("");
  for(var i=0;i<cells;i++){var d=new Date(start);d.setDate(start.getDate()+i);var k=ymd(d),ev=(byDay[k]||[]).slice();
    ev.sort(function(a,b){if(a.k!==b.k)return a.k==="open"?-1:1;return a.k==="open"?a.d-b.d:0});
    var cls="cell"+(d.getMonth()!==ui.m?" out":"")+(k===t?" today":"")+(d.getDay()===0?" sun":d.getDay()===6?" sat":"");
    h+='<div class="'+cls+'" data-act="day" data-d="'+k+'"><span class="dn">'+d.getDate()+'</span>';
    var max=4;ev.slice(0,max).forEach(function(e){var dim=isDim(e.sh)?" dim":"";
      if(e.k==="open")h+='<button class="chip open'+dim+'" style="--gc:'+gvar(e.sh.genre)+'" data-act="edit" data-id="'+e.sh.id+'" title="'+esc(e.sh.title+" · "+(e.o.label||"")+" "+hm(e.d))+'"><span class="t">'+hm(e.d)+'</span>'+esc(e.sh.title)+'</button>';
      else h+='<button class="chip run'+dim+'" style="--gc:'+gvar(e.sh.genre)+'" data-act="edit" data-id="'+e.sh.id+'" title="'+esc(e.sh.title+" 공연")+'">'+esc(e.sh.title)+'</button>'});
    if(ev.length>max)h+='<span class="more">+'+(ev.length-max)+'개 더</span>';
    h+='</div>'}
  return h+'</div>'}

function nextOpen(sh){var n=new Date(),best=null;(sh.opens||[]).forEach(function(o){var d=parseDT(o.at);if(d&&d>=n&&(!best||d<best.d))best={o:o,d:d}});return best}
function listView(){var list=state.shows.filter(passes);
  if(!list.length)return'<div class="emptyhint">아직 등록된 공연이 없어요. 오른쪽 위 <b>＋ 콘서트 추가</b>로 시작해 보세요.</div>';
  list.sort(function(a,b){var x=nextOpen(a),y=nextOpen(b);if(x&&y)return x.d-y.d;if(x)return-1;if(y)return 1;return(parseDT(b.start)||0)-(parseDT(a.start)||0)});
  var n=new Date();
  return'<table class="lt"><thead><tr><th>콘서트</th><th>티켓 오픈</th><th class="hide-m">공연 기간</th><th class="hide-m">예매처</th><th>상태</th></tr></thead><tbody>'+list.map(function(sh){
    var op=(sh.opens||[]).map(function(o){var d=parseDT(o.at);if(!d)return"";return'<span class="mono'+(d<n?" past":"")+'">'+esc(o.label||"오픈")+' '+fmtDT(d)+'</span>'}).join("")||'<span class="past">미정</span>';
    var s=parseDT(sh.start),e=parseDT(sh.end);var per=s?fmtD(s)+(e&&ymd(e)!==ymd(s)?" ~ "+fmtD(e):""):"미정";
    return'<tr class="row" data-act="edit" data-id="'+sh.id+'"><td><div class="tt">'+esc(sh.title)+'</div><span class="tag g" style="--gc:'+gvar(sh.genre)+'">'+(GNAME[sh.genre]||"기타")+'</span> <span style="color:var(--mute);font-size:12px">'+(sh.genre==="etc"?esc(sh.venue||""):"")+'</span></td><td><div class="opens">'+op+'</div></td><td class="hide-m">'+per+'</td><td class="hide-m">'+esc(sh.site||"")+'</td><td><span class="tag st-'+sh.status+'">'+(SNAME[sh.status]||"관심")+'</span></td></tr>'}).join("")+'</tbody></table>'}

function hero(){var n=new Date(),up=allOpens().filter(function(x){return x.d>=n&&!isDim(x.sh)});
  if(!up.length)return'<div class="hero empty"><div class="k">다음 티켓팅</div><div class="tt">예정된 티켓 오픈이 없어요</div></div>';
  var x=up[0],u=safeUrl(x.sh.url);
  return'<div class="hero" style="--gc:'+gvar(x.sh.genre)+'"><span class="bar"></span><div class="k">다음 티켓팅 · '+esc(x.o.label||"오픈")+'</div><div class="tt">'+esc(x.sh.title)+'</div><div class="meta">'+fmtDT(x.d)+(x.sh.site?" · "+esc(x.sh.site):"")+'</div><div class="cd mono" data-cd="'+x.d.getTime()+'">'+countdown(x.d-n)+'</div><div class="acts">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">예매처 열기 ↗</a>':"")+'<a href="'+esc(gcal(x.sh,x.o))+'" target="_blank" rel="noopener">구글 캘린더에 알림 추가 ↗</a></div></div>'}

function upcoming(){var n=new Date(),since=new Date(n.getTime()-36e5*3),up=allOpens().filter(function(x){return x.d>=since});
  var h='<div class="card up"><h3>다가오는 티켓 오픈<span>'+up.length+'건</span></h3>';
  if(!up.length)return h+'<div class="emptyhint">예정된 오픈이 없어요.</div></div>';
  return h+'<ul class="ulist">'+up.slice(0,40).map(function(x){var dn=dayDiff(x.d),cls=dn<=0?"hot":dn<=3?"warm":"",lab=x.d<n?"지남":dn===0?(x.d-n<36e5*12?"<span data-cdshort=\""+x.d.getTime()+"\">"+hm(x.d)+"</span>":"D-DAY"):ddLabel(x.d);
    return'<li class="ui'+(isDim(x.sh)?" dim":"")+'" data-act="edit" data-id="'+x.sh.id+'" style="--gc:'+gvar(x.sh.genre)+'"><div class="dd '+cls+'">'+lab+'</div><div style="min-width:0"><div class="a">'+esc(x.sh.title)+'</div><div class="b"><span class="gd"></span>'+esc(x.o.label||"오픈")+' · <span class="mono">'+fmtDT(x.d)+'</span>'+(x.sh.site?" · "+esc(x.sh.site):"")+'</div></div></li>'}).join("")+'</ul></div>'}

function tick(){var n=Date.now();var el=root.querySelector("[data-cd]");if(el){var t=+el.getAttribute("data-cd");el.textContent=countdown(t-n);if(t-n<=0&&t-n>-1500)render()}
  root.querySelectorAll("[data-cdshort]").forEach(function(e){var t=+e.getAttribute("data-cdshort"),ms=t-n;if(ms>0){var m=Math.floor(ms/6e4);e.textContent=m>=60?Math.floor(m/60)+"시간":m+"분"}else e.textContent="오픈"})}
setInterval(tick,1000);

  '<label class="fld"><span>메모</span><textarea name="memo" rows="2" placeholder="좌석 구역, 인증 필요 여부, 가격 등">'+esc(sh.memo||"")+'</textarea></label>'+
  '<datalist id="olabels">'+OPEN_LABELS.map(function(l){return'<option value="'+l+'">'}).join("")+'</datalist><datalist id="sites">'+SITES.map(function(l){return'<option value="'+l+'">'}).join("")+'</datalist>'+
  '</div><div class="mf">'+(isNew?"":'<button type="button" class="btn danger ghost" data-del>삭제</button>')+'<span class="spacer"></span><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">저장</button></div></form>';
  openModal(html,function(ov){var f=ov.querySelector("#ef"),box=ov.querySelector("#opens");if(mode==="site"){[].forEach.call(f.querySelectorAll("input,textarea,select"),function(el){if(el.name!=="status")el.disabled=true});[].forEach.call(ov.querySelectorAll("[data-addo],[data-rm],[data-del]"),function(el){el.style.display="none"});ov.querySelector(".mh h3").textContent="콘서트 상세";var lk=safeUrl(sh.url);if(lk){var a=document.createElement("a");a.className="btn";a.href=lk;a.target="_blank";a.rel="noopener";a.textContent="예매처 열기 ↗";var mf=ov.querySelector(".mf");mf.insertBefore(a,mf.firstChild)}}

      opens.sort(function(a,b){return a.at<b.at?-1:1});

function dayModal(k){var d=parseDT(k),items=[];
  state.shows.forEach(function(sh){(sh.opens||[]).forEach(function(o){var od=parseDT(o.at);if(od&&ymd(od)===k)items.push({k:"open",sh:sh,o:o,d:od})});
    var s=parseDT(sh.start),e=parseDT(sh.end)||s;if(s&&k>=ymd(s)&&k<=ymd(e))items.push({k:"run",sh:sh})});
  items.sort(function(a,b){if(a.k!==b.k)return a.k==="open"?-1:1;return a.k==="open"?a.d-b.d:0});
  var html='<div class="mh"><h3>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')</h3><button class="x" data-close>×</button></div><div class="mb">'+
   (items.length?items.map(function(x){var u=safeUrl(x.sh.url);return'<div class="dayitem" data-id="'+x.sh.id+'" style="--gc:'+gvar(x.sh.genre)+'"><span class="bar"></span><div style="flex:1;min-width:0"><div class="a">'+esc(x.sh.title)+'</div><div class="b">'+(x.k==="open"?'🎫 '+esc(x.o.label||"티켓 오픈")+' <span class="mono">'+hm(x.d)+'</span>':"공연일")+" · "+esc(x.sh.genre==="etc"?(x.sh.venue||"기타 공연장"):GNAME[x.sh.genre]||"")+(x.sh.site?" · "+esc(x.sh.site):"")+'</div></div>'+
     (x.k==="open"?'<a class="btn sm" href="'+esc(gcal(x.sh,x.o))+'" target="_blank" rel="noopener" data-stop>알림↗</a>':"")+(u?'<a class="btn sm" href="'+esc(u)+'" target="_blank" rel="noopener" data-stop>예매↗</a>':"")+'</div>'}).join(""):'<div class="emptyhint" style="padding:6px 0">이 날은 일정이 없어요.</div>')+
   '</div><div class="mf"><span class="spacer"></span><button class="btn" data-close>닫기</button></div>';
  openModal(html,function(ov){ov.addEventListener("click",function(e){var t=e.target;
    if(t.closest("[data-stop]"))return;
    if(t.closest("[data-close]"))closeModal();
    else if(t.closest("[data-addday]"))editModal({genre:"kspo",status:"interest",opens:[{label:"팬클럽 선예매",at:k+"T20:00"},{label:"일반예매",at:""}]},true);
    else{var it=t.closest(".dayitem");if(it){var sh=find(it.dataset.id);if(sh)editModal(sh,false)}}})})}

function backupModal(){var html='<div class="mh"><h3>백업 · 복원</h3><button class="x" data-close>×</button></div><div class="mb"><div style="font-size:13px;color:var(--mute)">아래 내용을 복사해 두면 언제든 붙여넣어 복원할 수 있어요.</div><label class="fld"><textarea class="json" id="bj">'+esc(JSON.stringify(state,null,1))+'</textarea></label></div><div class="mf"><button class="btn" data-copy>복사</button><span class="spacer"></span><button class="btn" data-close>닫기</button><button class="btn primary" data-restore>붙여넣은 내용으로 복원</button></div>';
  openModal(html,function(ov){ov.addEventListener("click",function(e){var t=e.target;
    if(t.closest("[data-close]"))closeModal();
    else if(t.closest("[data-copy]")){var v=ov.querySelector("#bj").value;try{navigator.clipboard.writeText(v).then(function(){toast("복사했어요")},function(){ov.querySelector("#bj").select();toast("텍스트를 선택했어요. Ctrl/⌘+C로 복사하세요")})}catch(_){ov.querySelector("#bj").select()}}
    else if(t.closest("[data-restore]")){try{var d=JSON.parse(ov.querySelector("#bj").value);if(!d||!Array.isArray(d.shows))throw 0;d.shows.forEach(function(s){if(!s.id)s.id=uid();if(!Array.isArray(s.opens))s.opens=[]});state={shows:d.shows};closeModal();render();persist("복원했어요")}catch(_){toast("형식이 올바르지 않아요")}}})})}

/* ---------- events ---------- */
root.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(!t||t.tagName==="SELECT"||t.type==="checkbox")return;var a=t.dataset.act;
  if(a==="edit"){e.stopPropagation();var sh=find(t.dataset.id);if(sh)editModal(sh,false)}
  else if(a==="day")dayModal(t.dataset.d);
  else if(a==="new")editModal({genre:"kspo",status:"interest"},true);
  else if(a==="prev"){ui.m--;if(ui.m<0){ui.m=11;ui.y--}saveUI();render()}
  else if(a==="next"){ui.m++;if(ui.m>11){ui.m=0;ui.y++}saveUI();render()}
  else if(a==="today"){var n=new Date();ui.y=n.getFullYear();ui.m=n.getMonth();saveUI();render()}
  else if(a==="view"){ui.view=t.dataset.v;saveUI();render()}
  else if(a==="backup")backupModal()});
root.addEventListener("change",function(e){var t=e.target,a=t.dataset.act;
  if(a==="genre"){ui.genre=t.value}else if(a==="status"){ui.status=t.value}else if(a==="runs"){ui.runs=t.checked}else return;saveUI();render()});

render();
})();
</script></body></html>
